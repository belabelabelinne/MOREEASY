<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Bluefit · Maria Monteiro</title>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#111827; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#eef3fb; }
    #app { display:none; width:100%; height:100%; border:0; background:#f5f7fb; }
    #app.ready { display:block; }
    #secureLogin { position:fixed; inset:0; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 15% 10%,#2e6bff 0,#172554 42%,#080f1f 100%); z-index:10; }
    .login-card { width:min(430px,100%); padding:38px; background:rgba(255,255,255,.97); border:1px solid rgba(255,255,255,.6); border-radius:24px; box-shadow:0 28px 90px rgba(0,0,0,.28); }
    .brand-mark { width:54px; height:54px; display:grid; place-items:center; margin-bottom:20px; border-radius:16px; color:#fff; background:linear-gradient(135deg,#2563eb,#0ea5e9); font-size:25px; font-weight:900; box-shadow:0 12px 25px rgba(37,99,235,.28); }
    h1 { margin:0; color:#101827; font-size:25px; letter-spacing:-.04em; }
    .login-card p { margin:8px 0 26px; color:#64748b; line-height:1.5; }
    .login-card label { display:block; margin:14px 0 6px; color:#475569; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; }
    .login-card input { width:100%; min-height:46px; padding:12px 13px; border:1px solid #d7dfeb; border-radius:11px; outline:0; font:inherit; }
    .login-card input:focus { border-color:#2563eb; box-shadow:0 0 0 4px rgba(37,99,235,.12); }
    #loginButton { width:100%; min-height:48px; margin-top:20px; border:0; border-radius:11px; color:#fff; background:#2563eb; font:700 15px inherit; cursor:pointer; }
    #loginButton:hover { background:#1d4ed8; }
    #loginButton:disabled { opacity:.65; cursor:wait; }
    #loginError { min-height:21px; margin-top:12px; color:#dc2626; font-size:13px; font-weight:700; }
    .security-note { margin-top:18px!important; margin-bottom:0!important; font-size:12px; }
    #loading { position:fixed; inset:0; display:grid; place-items:center; color:#fff; background:#0b1220; z-index:20; font-weight:700; }
    #loading.hidden { display:none; }
  </style>
</head>
<body>
  <div id="loading">Verificando acesso seguro…</div>
  <section id="secureLogin" hidden>
    <form class="login-card" id="loginForm">
      <div class="brand-mark">B</div>
      <h1>Bluefit Maria Monteiro</h1>
      <p>Acesso individual da equipe de recepção.</p>
      <label for="loginEmail">E-mail do funcionário</label>
      <input id="loginEmail" type="email" autocomplete="username" placeholder="funcionario@empresa.com" required>
      <label for="loginPassword">Senha</label>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
      <button id="loginButton" type="submit">Entrar no sistema</button>
      <div id="loginError" role="alert"></div>
      <p class="security-note">Cada funcionário deve usar seu próprio usuário. A criação e a remoção de contas ficam no Firebase Authentication.</p>
    </form>
  </section>
  <iframe id="app" title="Atendimento Bluefit Maria Monteiro" src="Atendimento_Bluefit-5.html"></iframe>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBWmnyqKg6TBSGgC-3e_LaadjLQv4VSN9mU",
      authDomain: "gymrecep.firebaseapp.com",
      projectId: "gymrecep",
      storageBucket: "gymrecep.firebasestorage.app",
      messagingSenderId: "489381167071",
      appId: "1:489381167071:web:f07b3e0e725eafb13dce6a"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});

    const loading = document.getElementById('loading');
    const login = document.getElementById('secureLogin');
    const app = document.getElementById('app');
    const form = document.getElementById('loginForm');
    const button = document.getElementById('loginButton');
    const error = document.getElementById('loginError');

    function mostrarErro(mensagem) {
      error.textContent = mensagem;
      button.disabled = false;
    }
    function prepararAplicacao() {
      try {
        const doc = app.contentDocument;
        doc.body.classList.remove('bluefit-locked');
        const antigaTela = doc.getElementById('bluefitLogin');
        if (antigaTela) antigaTela.remove();
        if (typeof app.contentWindow.iniciarApp === 'function') app.contentWindow.iniciarApp();
        const header = doc.querySelector('header');
        if (header && !doc.getElementById('logoutEmployee')) {
          const sair = doc.createElement('button');
          sair.id = 'logoutEmployee';
          sair.className = 'btn small secondary';
          sair.textContent = 'Sair';
          sair.style.cssText = 'position:absolute;right:24px;top:24px;z-index:2;';
          sair.addEventListener('click', () => auth.signOut());
          header.appendChild(sair);
        }
      } catch (e) { console.error(e); }
      app.classList.add('ready');
    }
    app.addEventListener('load', prepararAplicacao);

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      button.disabled = true;
      try {
        await auth.signInWithEmailAndPassword(
          document.getElementById('loginEmail').value.trim(),
          document.getElementById('loginPassword').value
        );
      } catch (e) {
        const mensagens = {
          'auth/invalid-credential':'E-mail ou senha incorretos.',
          'auth/user-not-found':'Usuário não encontrado.',
          'auth/wrong-password':'E-mail ou senha incorretos.',
          'auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos.',
          'auth/invalid-email':'Digite um e-mail válido.'
        };
        mostrarErro(mensagens[e.code] || 'Não foi possível entrar. Tente novamente.');
      }
    });

    auth.onAuthStateChanged((user) => {
      loading.classList.add('hidden');
      if (user && user.email) {
        login.hidden = true;
        prepararAplicacao();
      } else {
        app.classList.remove('ready');
        login.hidden = false;
      }
    });
  </script>
</body>
</html>
